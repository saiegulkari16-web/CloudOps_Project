services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: cloudops
      DB_USER: clouduser
      DB_PASSWORD: localdev123

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: cloudops
    volumes:
      - cloudops-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"

volumes:
  cloudops-postgres-data:
    external: true
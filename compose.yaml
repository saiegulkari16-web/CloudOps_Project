services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: cloudops
      DB_USER: clouduser
      DB_PASSWORD: localdev123
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: cloudops
    volumes:
      - cloudops-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"

  
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: cloudops_grafana
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cloudops-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg



volumes:
  cloudops-postgres-data:
    external: true



